# Checks collaboration docs, templates, and local links.
# It does not install dependencies, read secrets, or run application tests.

name: Workflow scaffolding

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffolding:
    name: Check workflow scaffolding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate scaffolding
        run: python3 scripts/check_workflow.py
