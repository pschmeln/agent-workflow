# Checks collaboration docs and runs the host cane-logic tests.
# It does not install dependencies, read secrets, compile iOS, or flash hardware.

name: Workflow scaffolding

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffolding:
    name: Check workflow scaffolding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate scaffolding
        run: python3 scripts/check_workflow.py
      - name: Run host logic tests
        run: make -C prototype test
