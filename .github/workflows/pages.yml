# Publishes the static Bluefy page after a push to main.
# It does not run on pull requests, does not sign an app, and does not
# change the phone runtime. GitHub Pages still has to be switched to
# GitHub Actions by a person before a deploy can succeed.

name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Publish web page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload web folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
